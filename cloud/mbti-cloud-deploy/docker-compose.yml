# 知乎 API 密钥（服务端 AI/热榜/搜索/导入都要用）
# 在阿里云控制台「实例 → 安全组」放行 3001 后，用以下方式传参：
#   -e ZHIHU_ACCESS_SECRET='你的密钥'
# 密钥可向知乎开放平台申请；没有可先部署，除知乎相关功能外其余可用。

services:
  mbti-debate:
    image: mbti-debate:latest
    container_name: mbti-debate
    restart: always
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MBTI_DATA_DIR=/app/data
      # 填入你的知乎密钥（申请地址 developer.zhihu.com）
      - ZHIHU_ACCESS_SECRET=你的密钥
    volumes:
      # 数据持久化：数据库存这里，升级/重建容器不丢数据
      - mbti_data:/app/data
volumes:
  mbti_data:
